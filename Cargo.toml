[package]
name = "minebox-bot"
version = "0.1.0"
edition = "2021"
description = "Bot Discord pour Minebox Tools"
license = "MIT"

[dependencies]
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "builder", "collector", "cache", "utils", "http", "framework"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
